name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s . -v
      - run: bash -n start-linux.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained application
        shell: pwsh
        run: ./windows/build.ps1
      - name: Smoke-test embedded backend
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/USB-CAN Tuner Bridge.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Executable smoke test failed.' }
          $report = Get-Content "$env:LOCALAPPDATA/UsbCanTuner/smoke-test.json" | ConvertFrom-Json
          if (-not $report.ok) { throw 'Payload extraction failed.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: usb-can-tuner-windows-x64
          path: dist/USB-CAN Tuner Bridge.exe
          if-no-files-found: error
